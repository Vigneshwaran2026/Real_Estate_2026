<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Property Not Found | Real Estate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000;
            --white: #fff;
            --ul-primary: #7065F0;
            --ul-secondary: #000929;
            --ul-gray: #EBEBEB;
            --ul-black: #111111;
            --ul-gray2: #6C6E76;
            --ul-gradient: linear-gradient(90deg, var(--ul-primary) 0%, var(--ul-secondary) 100%);
            --font-primary: "Plus Jakarta Sans", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-primary);
            background: var(--ul-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 20% 80%, rgba(112, 101, 240, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(112, 101, 240, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(0, 9, 41, 0.8) 0%, transparent 50%);
            animation: bgMove 20s ease-in-out infinite;
        }

        @keyframes bgMove {
            0%, 100% { transform: translate(-10%, -10%) rotate(0deg); }
            50% { transform: translate(10%, 10%) rotate(180deg); }
        }

        /* Floating Elements */
        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .float-item {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .float-item:nth-child(1) {
            top: 10%;
            left: 10%;
            font-size: 2rem;
            animation-delay: 0s;
        }

        .float-item:nth-child(2) {
            top: 20%;
            right: 15%;
            font-size: 1.5rem;
            animation-delay: 1s;
        }

        .float-item:nth-child(3) {
            bottom: 30%;
            left: 15%;
            font-size: 1.8rem;
            animation-delay: 2s;
        }

        .float-item:nth-child(4) {
            bottom: 20%;
            right: 10%;
            font-size: 2.2rem;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        /* 404 Display */
        .error-code {
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 800;
            line-height: 1;
            background: var(--ul-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            display: inline-block;
            margin-bottom: 1rem;
            text-shadow: 0 0 80px rgba(112, 101, 240, 0.3);
        }

        .error-code::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--ul-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(40px);
            opacity: 0.5;
            z-index: -1;
        }

        /* House Icon */
        .house-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            position: relative;
            animation: housePulse 3s ease-in-out infinite;
        }

        @keyframes housePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .house-svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--ul-primary);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .house-roof {
            animation: roofShake 4s ease-in-out infinite;
            transform-origin: center bottom;
        }

        @keyframes roofShake {
            0%, 90%, 100% { transform: rotate(0deg); }
            92% { transform: rotate(-2deg); }
            94% { transform: rotate(2deg); }
            96% { transform: rotate(-2deg); }
            98% { transform: rotate(2deg); }
        }

        /* Content */
        .content {
            color: var(--white);
        }

        .title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--white);
        }

        .description {
            font-size: 1.1rem;
            color: var(--ul-gray2);
            margin-bottom: 2.5rem;
            line-height: 1.6;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Search Box */
        .search-container {
            position: relative;
            max-width: 450px;
            margin: 0 auto 2rem;
        }

        .search-box {
            width: 100%;
            padding: 1rem 3.5rem 1rem 1.5rem;
            border: 2px solid rgba(112, 101, 240, 0.3);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--white);
            font-family: var(--font-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--ul-primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(112, 101, 240, 0.3);
        }

        .search-box::placeholder {
            color: var(--ul-gray2);
        }

        .search-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--ul-gradient);
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .search-btn:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 5px 20px rgba(112, 101, 240, 0.4);
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--ul-gradient);
            color: var(--white);
            border: none;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(112, 101, 240, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--white);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            border-color: var(--ul-primary);
            background: rgba(112, 101, 240, 0.1);
            transform: translateY(-3px);
        }

        /* Property Cards Preview */
        .properties-preview {
            margin-top: 4rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.5s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                opacity: 0;
                transform: translateY(30px);
            }
        }

        .property-card {
            width: 200px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .property-card:hover {
            transform: translateY(-10px);
            border-color: var(--ul-primary);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .property-image {
            height: 120px;
            background: var(--ul-gradient);
            position: relative;
            overflow: hidden;
        }

        .property-image::after {
            content: '🏠';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            opacity: 0.3;
        }

        .property-info {
            padding: 1rem;
            text-align: left;
        }

        .property-price {
            color: var(--ul-primary);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .property-location {
            color: var(--ul-gray2);
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            .house-icon {
                width: 80px;
                height: 80px;
            }

            .property-card {
                width: 150px;
            }

            .button-group {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 280px;
                justify-content: center;
            }
        }

        /* Glitch Effect on Hover */
        .error-code:hover {
            animation: glitch 0.3s ease infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        /* Loading Animation for Search */
        .searching {
            position: relative;
        }

        .searching::after {
            content: '';
            position: absolute;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: 2px solid var(--ul-primary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: translateY(-50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation"></div>
    
    <!-- Floating Elements -->
    <div class="floating-elements">
        <div class="float-item">🏠</div>
        <div class="float-item">🔑</div>
        <div class="float-item">📍</div>
        <div class="float-item">🏢</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- House Icon -->
        <div class="house-icon">
            <svg class="house-svg" viewBox="0 0 100 100">
                <path class="house-roof" d="M50 10 L90 45 L80 45 L80 90 L20 90 L20 45 L10 45 Z" fill="rgba(112, 101, 240, 0.2)"/>
                <rect x="35" y="55" width="12" height="12" fill="rgba(112, 101, 240, 0.4)"/>
                <rect x="53" y="55" width="12" height="12" fill="rgba(112, 101, 240, 0.4)"/>
                <rect x="42" y="72" width="16" height="18" fill="rgba(112, 101, 240, 0.4)"/>
                <path d="M50 10 L90 45" stroke-width="3"/>
                <path d="M50 10 L10 45" stroke-width="3"/>
                <path d="M20 45 L20 90" stroke-width="2"/>
                <path d="M80 45 L80 90" stroke-width="2"/>
                <path d="M20 90 L80 90" stroke-width="2"/>
            </svg>
        </div>

        <!-- 404 Code -->
        <div class="error-code">404</div>

        <!-- Content -->
        <div class="content">
            <h1 class="title">Property Not Found</h1>
            <p class="description">
                Oops! It seems this property has been moved, sold, or never existed. 
                Don't worry, we have plenty of other amazing properties waiting for you.
            </p>

            <!-- Buttons -->
            <div class="button-group">
                <a href="user-dashboard.html" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Back to Dashboard
                </a>
            </div>
        </div>

    </div>

    <script>
        // Parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX / window.innerWidth - 0.5;
            const mouseY = e.clientY / window.innerHeight - 0.5;
            
            const house = document.querySelector('.house-icon');
            const errorCode = document.querySelector('.error-code');
            
            house.style.transform = `translate(${mouseX * 20}px, ${mouseY * 20}px)`;
            errorCode.style.transform = `translate(${mouseX * -10}px, ${mouseY * -10}px)`;
        });

        // Random floating animation for elements
        const floatItems = document.querySelectorAll('.float-item');
        floatItems.forEach((item, index) => {
            item.style.left = `${Math.random() * 80 + 10}%`;
            item.style.top = `${Math.random() * 80 + 10}%`;
            item.style.animationDelay = `${index * 0.5}s`;
        });

        // Property cards hover effect enhancement
        const cards = document.querySelectorAll('.property-card');
        cards.forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-10px) scale(1.02)';
            });
            
            card.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) scale(1)';
            });
        });

        // Glitch effect trigger
        const errorCode = document.querySelector('.error-code');
        setInterval(() => {
            if (Math.random() > 0.95) {
                errorCode.style.animation = 'glitch 0.3s ease';
                setTimeout(() => {
                    errorCode.style.animation = '';
                }, 300);
            }
        }, 3000);

        // Console easter egg
        console.log('%c🏠 Welcome to Real Estate 404!', 'color: #7065F0; font-size: 20px; font-weight: bold;');
        console.log('%cLooking for a property? Try the search box above!', 'color: #6C6E76; font-size: 12px;');
    </script>
</body>
</html>
